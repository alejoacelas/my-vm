# hut settings — sourced by ./hut. Override any of these in hut.local.conf (gitignored).
HUT_NAME="${HUT_NAME:-hut}"            # Hetzner server name
HUT_TYPE="${HUT_TYPE:-cx33}"           # 4 vCPU / 8 GB / 80 GB; `hut types` lists prices
HUT_LOCATION="${HUT_LOCATION:-nbg1}"   # Nuremberg; fsn1 Falkenstein, hel1 Helsinki, ash Ashburn
HUT_IMAGE="${HUT_IMAGE:-ubuntu-24.04}"
HUT_USER="${HUT_USER:-alejo}"          # login user created by cloud-init
HUT_SSH_KEY="${HUT_SSH_KEY:-$HOME/.ssh/id_ed25519.pub}"
HUT_DOTFILES="${HUT_DOTFILES:-https://github.com/alejoacelas/dotfiles.git}"

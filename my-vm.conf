# my-vm settings — sourced by ./my-vm. Override any of these in my-vm.local.conf (gitignored).
MYVM_NAME="${MYVM_NAME:-my-vm}"            # Hetzner server name
MYVM_TYPE="${MYVM_TYPE:-cx33}"           # 4 vCPU / 8 GB / 80 GB; `my-vm types` lists prices
MYVM_LOCATION="${MYVM_LOCATION:-nbg1}"   # Nuremberg; fsn1 Falkenstein, hel1 Helsinki, ash Ashburn
MYVM_IMAGE="${MYVM_IMAGE:-ubuntu-24.04}"
MYVM_USER="${MYVM_USER:-alejo}"          # login user created by cloud-init
MYVM_SSH_KEY="${MYVM_SSH_KEY:-$HOME/.ssh/id_ed25519.pub}"
MYVM_DOTFILES="${MYVM_DOTFILES:-https://github.com/alejoacelas/dotfiles.git}"

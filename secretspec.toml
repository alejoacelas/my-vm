[project]
name = "my-vm"
revision = "1.0"
require_reason = "agents"

[providers]
developer_credentials = "onepassword://Developer-Credentials"

[profiles.default]
HCLOUD_TOKEN = { description = "Hetzner Cloud API token (project > Security > API tokens, Read & Write)", required = true, providers = ["developer_credentials"] }
TS_AUTHKEY = { description = "Tailscale auth key (admin > Settings > Keys; reusable, pre-approved, tag or no expiry). Optional: without it the box is reached by public IP + SSH key", required = false, providers = ["developer_credentials"] }

# devbox settings — sourced by ./devbox. Override any of these in devbox.local.conf (gitignored).
DEVBOX_NAME="${DEVBOX_NAME:-devbox}"            # Hetzner server name
DEVBOX_TYPE="${DEVBOX_TYPE:-cx33}"           # 4 vCPU / 8 GB / 80 GB; `devbox types` lists prices
DEVBOX_LOCATION="${DEVBOX_LOCATION:-nbg1}"   # Nuremberg; fsn1 Falkenstein, hel1 Helsinki, ash Ashburn
DEVBOX_IMAGE="${DEVBOX_IMAGE:-ubuntu-24.04}"
DEVBOX_USER="${DEVBOX_USER:-alejo}"          # login user created by cloud-init
DEVBOX_SSH_KEY="${DEVBOX_SSH_KEY:-$HOME/.ssh/id_ed25519.pub}"
DEVBOX_DOTFILES="${DEVBOX_DOTFILES:-https://github.com/alejoacelas/dotfiles.git}"
